# Builds the iPhone app on a free GitHub cloud Mac, for the iPhone Simulator.
# This checks that the iOS code builds without needing your own Mac or an Apple account.
# It does NOT make an app you can install on a real iPhone; that needs an Apple Developer
# account and signing (see ios/README.md, "Put it on your iPhone").
# Run it from GitHub: Actions tab -> "iOS build" -> Run workflow.
name: iOS build

on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Briefcase and Pillow
        run: python -m pip install --upgrade briefcase pillow
      - name: Copy Stock Lens code and draw icons
        run: python ios/sync.py
      - name: Create and build the iOS app (Simulator)
        working-directory: ios
        run: |
          briefcase create iOS --no-input
          briefcase build iOS --no-input
      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ios/logs
          if-no-files-found: ignore
